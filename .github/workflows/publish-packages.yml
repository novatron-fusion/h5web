name: Publish packages

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🏷️
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Match tag to package version 🧐
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG" != "$VERSION" ]; then
            echo "Git tag ($GITHUB_REF) does not match package.json version ($VERSION)"
            exit 1
          fi

      - name: Install ⚙️
        uses: ./.github/actions/install

      - name: Rename packages for GitHub Packages 📛
        run: |
          # Rename @h5web/* scope to @novatron-fusion/h5web-* in source and config files.
          # This is a CI-only operation — source code in git stays as @h5web/*.
          find . -type f -not -path './node_modules/*' -not -path './.git/*' \
            -not -path '*/dist/*' -not -path '*/dist-ts/*' \
            -not -name 'pnpm-lock.yaml' \
            \( -name 'package.json' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) \
            -exec sed -i 's/@h5web\//@novatron-fusion\/h5web-/g' {} +

      - name: Reinstall with renamed packages ⚙️
        run: pnpm install --no-frozen-lockfile

      - name: Build packages 📦
        run: pnpm packages

      - name: Configure npm auth for GitHub Packages 🔑
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages 🥳
        run: pnpm -r publish --no-git-checks --tag $NPM_TAG
        env:
          NPM_TAG: "${{ contains(github.ref_name, 'beta') && 'next' || 'latest' }}"
