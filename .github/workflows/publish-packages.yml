name: Publish packages

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🏷️
        uses: actions/checkout@v6

      - name: Match tag to package version 🧐
        id: packageVersion
        uses: geritol/match-tag-to-package-version@0.2.0
        with:
          TAG_PREFIX: v

      - name: Install ⚙️
        uses: ./.github/actions/install

      - name: Rename packages for GitHub Packages 📛
        run: |
          # Rename @h5web/* scope to @novatron-fusion/h5web-* in source and config files.
          # This is a CI-only operation — source code in git stays as @h5web/*.
          find . -not -path './node_modules/*' -not -path './.git/*' \
            -not -path '*/dist/*' -not -path '*/dist-ts/*' \
            -not -name 'pnpm-lock.yaml' \
            \( -name 'package.json' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) \
            -exec sed -i 's/@h5web\//@novatron-fusion\/h5web-/g' {} +

      - name: Reinstall with renamed packages ⚙️
        run: pnpm install --no-frozen-lockfile

      - name: Build packages 📦
        run: pnpm packages

      - name: Configure npm auth for GitHub Packages 🔑
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages 🥳
        run: pnpm -r publish --access public --no-git-checks --tag $NPM_TAG
        env:
          NPM_TAG: "${{ contains(steps.packageVersion.outputs.PACKAGE_VERSION, 'beta') && 'next' || 'latest' }}"
